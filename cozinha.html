<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Cocina • Cozinha</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f7f3ef;color:#2d2521}header{background:#4d1720;color:#fff;padding:18px;text-align:center;position:sticky;top:0;z-index:5}main{max-width:1000px;margin:auto;padding:12px}.tabs{display:flex;gap:8px;margin:10px 0}.tabs button{flex:1}.tab.active{background:#fff;color:#4d1720}.card{background:#fff;margin:10px 0;padding:14px;border-radius:14px;box-shadow:0 2px 8px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}.muted{color:#6b625e;font-size:13px}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#eee;margin:3px;font-size:12px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.items{margin:10px 0}.item{padding:7px 0;border-bottom:1px solid #eee}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.actions button{border:0;border-radius:8px;padding:9px 10px;font-weight:bold;background:#4d1720;color:white}.actions button.alt{background:#777}.danger{background:#8a2f2f!important}.topline{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}input{padding:11px;border:1px solid #ccc;border-radius:8px;width:160px;box-sizing:border-box}button{cursor:pointer}#login{max-width:430px;margin:35px auto}</style></head>
<body><header><h1>🍷 La Cocina</h1><div>Painel da cozinha e reservas</div></header><main>
<section id="login" class="card"><h2>Acesso da equipe</h2><p class="muted">Digite o PIN do painel.</p><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button onclick="login()">Entrar</button><div id="loginMsg" class="muted"></div></section>
<section id="app" style="display:none"><div class="topline"><b id="lastUpdate">—</b><button onclick="loadAll()">↻ Atualizar</button></div><div class="tabs"><button id="ordersTab" class="tab active" onclick="showTab('orders')">🍽️ Pedidos</button><button id="resTab" class="tab" onclick="showTab('reservations')">📅 Reservas</button></div><div id="orders"></div><div id="reservations" style="display:none"></div></section>
</main>
<script>
let PIN=sessionStorage.getItem('laCocinaPin')||'';
const statuses=['Novo','Em preparo','Pronto','Concluído'];
function auth(){return {'x-kitchen-pin':PIN}}
function login(){PIN=document.getElementById('pin').value.trim();if(!PIN){return}sessionStorage.setItem('laCocinaPin',PIN);loadAll().then(ok=>{if(ok){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';}})}
async function api(url,opts={}){opts.headers={...(opts.headers||{}),...auth()};const r=await fetch(url,opts);if(r.status===401)throw new Error('PIN');if(!r.ok)throw new Error('Erro');return r.json()}
function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function showTab(tab){document.getElementById('orders').style.display=tab==='orders'?'block':'none';document.getElementById('reservations').style.display=tab==='reservations'?'block':'none';document.getElementById('ordersTab').classList.toggle('active',tab==='orders');document.getElementById('resTab').classList.toggle('active',tab==='reservations')}
async function loadAll(){try{const [o,r]=await Promise.all([api('/.netlify/functions/get-orders'),api('/.netlify/functions/get-reservations')]);renderOrders(o.orders||[]);renderReservations(r.reservations||[]);document.getElementById('lastUpdate').textContent='Atualizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});return true}catch(e){if(e.message==='PIN'){document.getElementById('loginMsg').textContent='PIN incorreto ou não configurado.';sessionStorage.removeItem('laCocinaPin');return false}document.getElementById('loginMsg').textContent='Não foi possível carregar o painel.';return false}}
function renderOrders(list){const el=document.getElementById('orders');if(!list.length){el.innerHTML='<div class="card">Nenhum pedido registrado.</div>';return}el.innerHTML='<div class="grid">'+list.map(o=>{const c=o.customer||{};const d=o.delivery||{};return `<div class="card"><div class="row"><b>Pedido #${o.id.slice(0,6).toUpperCase()}</b><span class="pill">${o.status||'Novo'}</span></div><div class="muted">${new Date(o.createdAt).toLocaleString('pt-BR')}</div><p><b>${c.name||''}</b> • ${c.phone||''}</p><div class="items">${(o.items||[]).map(x=>`<div class="item"><b>${x.qty}x ${x.name}</b> — ${money(x.price*x.qty)}<div class="muted">${(x.opts||[]).join(' • ')}</div></div>`).join('')}</div>${o.fulfillment==='delivery'?`<p>🚗 <b>Entrega</b><br>${d.address||''}, ${d.number||''}${d.complement?' — '+d.complement:''}<br>${d.neighborhood||''} — ${d.cityuf||''} • CEP ${d.cep||''}<br>Taxa ${money(d.fee)} • Previsão ${d.estimatedTime||''}</p>`:'<p>🏠 <b>Retirada</b><br>R. Buriti, 38 — Centro</p>'}<p>💳 ${o.payment?.method||''}${o.payment?.changeFor?' • Troco para '+o.payment.changeFor:''}</p><div class="row"><b>TOTAL ${money(o.total)}</b></div><div class="actions">${statuses.map(s=>`<button class="${s==='Concluído'?'alt':''}" onclick="updateOrder('${o.id}','${s}')">${s}</button>`).join('')}</div></div>`}).join('')+'</div>'}
function renderReservations(list){const el=document.getElementById('reservations');if(!list.length){el.innerHTML='<div class="card">Nenhuma reserva registrada.</div>';return}el.innerHTML='<div class="grid">'+list.map(r=>`<div class="card"><div class="row"><b>📅 ${r.dateBR||r.date}</b><span class="pill">${r.status||'Aguardando'}</span></div><h3>${r.time||''}</h3><p><b>${r.name||''}</b> • ${r.people||''} pessoa(s)<br>📱 ${r.phone||''}</p>${r.note?`<p class="muted">📝 ${r.note}</p>`:''}<div class="actions"><button onclick="updateReservation('${r.id}','Confirmada')">Confirmar</button><button class="alt" onclick="updateReservation('${r.id}','Aguardando')">Aguardando</button><button class="danger" onclick="updateReservation('${r.id}','Cancelada')">Cancelar</button></div></div>`).join('')+'</div>'}
async function updateOrder(id,status){try{await api('/.netlify/functions/update-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});await loadAll();}catch(e){alert(e.message==='PIN'?'PIN incorreto ou expirado. Faça login novamente.':'Não foi possível atualizar o pedido. Tente novamente.');}}
async function updateReservation(id,status){try{await api('/.netlify/functions/update-reservation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});await loadAll();}catch(e){alert(e.message==='PIN'?'PIN incorreto ou expirado. Faça login novamente.':'Não foi possível atualizar a reserva. Tente novamente.');}}
if(PIN){document.getElementById('pin').value=PIN;loadAll().then(ok=>{if(ok){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block'}})}
setInterval(()=>{if(document.getElementById('app').style.display!=='none')loadAll()},5000);
</script></body></html>
